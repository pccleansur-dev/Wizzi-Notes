# Compose para desplegar en Coolify (https://notas.wizzi.com.ar).
# Las variables (GEMINI_API_KEY, GOOGLE_*, APP_URL, ...) se cargan desde el panel de Coolify.
services:
  wizzi-note:
    build: .
    expose:
      - "3000"
    environment:
      - PORT=3000
      - APP_URL=${APP_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - HOST_CPU=${HOST_CPU:-}
      - HOST_GPU=${HOST_GPU:-}
      - HOST_VRAM_GB=${HOST_VRAM_GB:-}
      - HOST_RAM_GB=${HOST_RAM_GB:-}
      - LLAMACPP_URL=http://llamacpp:8080
      - WHISPER_URL=http://whisper:9000
      - NEMOTRON_URL=http://host.docker.internal:9010
      - ASR_PROVIDER=${ASR_PROVIDER:-whisper}
      - ASR_LANGUAGE=${ASR_LANGUAGE:-es-ES}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_config:/app/config
      - llamacpp_models:/models
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - llamacpp
      - whisper
    restart: unless-stopped

  llamacpp:
    image: ghcr.io/abetlen/llama-cpp-python:latest
    container_name: wizzi-note-llamacpp-1
    environment:
      - MODEL=/models/active.gguf
      - N_GPU_LAYERS=${LLAMA_GPU_LAYERS:-35}
      - HOST=0.0.0.0
      - PORT=8080
      - CHAT_FORMAT=chatml
    volumes:
      - llamacpp_models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=openai_whisper
    volumes:
      - whisper_models:/root/.cache/whisper
    restart: unless-stopped

volumes:
  app_config:
  llamacpp_models:
  whisper_models:
