# Compose para desplegar en Coolify (https://notas.wizzi.com.ar).
# Las variables (GEMINI_API_KEY, GOOGLE_*, APP_URL, ...) se cargan desde el panel de Coolify.
services:
  wizzi-note:
    build: .
    expose:
      - "3000"
    environment:
      - PORT=3000
      - APP_URL=${APP_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      - HOST_CPU=${HOST_CPU:-}
      - HOST_GPU=${HOST_GPU:-}
      - HOST_VRAM_GB=${HOST_VRAM_GB:-}
      - HOST_RAM_GB=${HOST_RAM_GB:-}
      - LLAMACPP_URL=http://llamacpp:8080
      - WHISPER_URL=http://whisper:9000
      - NEMOTRON_URL=http://host.docker.internal:9010
      - ASR_PROVIDER=${ASR_PROVIDER:-whisper}
      - ASR_LANGUAGE=${ASR_LANGUAGE:-es-ES}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_config:/app/config
      - llamacpp_models:/models
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - llamacpp
      - whisper
    restart: unless-stopped

  # GPU: Coolify corre en Docker dentro de WSL2 sin NVIDIA Container Toolkit,
  # por eso se pasa /dev/dxg y las libs de WSL directamente.
  llamacpp:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: wizzi-note-llamacpp-1
    entrypoint: ["/app/llama-server"]
    command: ["-m", "/models/active.gguf", "--host", "0.0.0.0", "--port", "8080", "-ngl", "${LLAMA_GPU_LAYERS:-99}", "-c", "${LLAMA_CTX:-8192}"]
    environment:
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - llamacpp_models:/models
      - /usr/lib/wsl:/usr/lib/wsl:ro
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    environment:
      - ASR_MODEL=small
      - ASR_ENGINE=openai_whisper
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - whisper_models:/root/.cache/whisper
      - /usr/lib/wsl:/usr/lib/wsl:ro
    restart: unless-stopped

volumes:
  app_config:
  llamacpp_models:
  whisper_models:
